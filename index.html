    <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />


    <!-- O tema NAO segue a preferencia do sistema, e isso e deliberado.
         A pagina compoe os dois modos ao mesmo tempo: blocos Sigilo e blocos
         Cartaz alternados, com a troca no limite da secao. Ligar o interruptor
         global aqui jogaria a pagina inteira para o Cartaz e apagaria o ritmo,
         porque as secoes Sigilo nao declaram tema: elas usam o :root.
         Ver RNF-L19 em requisitos-landing.md. -->
    <script>
      document.documentElement.classList.add("js");
      // A cortina de introducao e decidida AQUI, antes da primeira pintura,
      // para nao piscar por cima do heroi ja pre-renderizado. Em TODA carga,
      // inclusive recarga no meio da pagina (decisao do gerente do projeto,
      // 06/09/2026); nunca sob movimento reduzido. Ver components/Intro.jsx.
      //
      // Os dois relogios abaixo NAO dependem do pacote de JavaScript, e e esse o
      // ponto: a cortina e CSS e este script a recolhe (display e trava de
      // rolagem) aos 3,2 s; e se o pacote nao acordar em 8 s, a classe `js`
      // sai e todo [data-revelar] e toda palavra apagada voltam a aparecer
      // (RNF-L35). App.jsx escreve `pronto` depois de hidratar. Se o pacote chegar
      // depois da hora, a classe NAO volta: a pagina fica aberta, sem movimento.
      (function () {
        try {
          var raiz = document.documentElement;
          if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
            raiz.classList.add("intro-pendente");
            setTimeout(function () { raiz.classList.remove("intro-pendente"); }, 3200);
          }
          setTimeout(function () {
            if (!raiz.classList.contains("pronto")) raiz.classList.remove("js");
          }, 8000);
        } catch (e) {}
      })();
    </script>

    <div id="raiz"><!--app-html--></div>
