    <meta
      property="og:description"
      content="O que não cresce é a comparação com quem não é natural. O teto natural foi medido, e existe um protocolo para chegar perto dele."
    />

    <meta property="og:image:height" content="630" />

    <link rel="preload" href="/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />


    <script>
      document.documentElement.classList.add("js");
      // O relógio abaixo NÃO depende do pacote de JavaScript, e é esse o ponto:
      // se o pacote não acordar em 8 s, a classe `js` sai e todo [data-revelar]
      // e toda palavra apagada voltam a aparecer (RNF-L35). App.jsx escreve `pronto` depois de hidratar. Se o pacote chegar
      // depois da hora, a classe NÃO volta: a página fica aberta, sem movimento.
      (function () {
        try {
          // F5 sempre abre no topo (na dobra). A restauração de rolagem do navegador depende de a página já ter a altura
          // final no instante em que ela roda, e aqui a altura muda depois (os trechos sticky das cortinas, o vídeo), então
          // ele pousava em outra seção; e um `#secao` esquecido na URL (do índice fixo, do menu) levava a ela a cada recarga.
          // Só na recarga: voltar e avançar, e links com `#`, seguem como o navegador faz.
          var nav = performance.getEntriesByType("navigation")[0];
          if (nav && nav.type === "reload") {
            if ("scrollRestoration" in history) history.scrollRestoration = "manual";
            if (location.hash) history.replaceState(null, "", location.pathname + location.search);
            scrollTo(0, 0);
          }
          var raiz = document.documentElement;
          // Quem volta da política ou dos termos (a marca vem de src/entries/documents.js, na mesma aba) já viu a abertura: sem cortina
          // e sem a entrada do herói. Vale uma vez: a marca é consumida aqui, e a próxima carga abre normal.
          var deDocumento = false;
          try {
            deDocumento = sessionStorage.getItem("fluor:from-document") === "1";
            sessionStorage.removeItem("fluor:from-document");
          } catch (e) {}
          if (deDocumento) raiz.classList.add("without-entry");
          setTimeout(function () {
            if (!raiz.classList.contains("pronto")) raiz.classList.remove("js");
          }, 8000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="overflow-x-hidden pendente:overflow-hidden bg-void text-bone font-tertiary text-body [-webkit-font-smoothing:antialiased]">
    <div id="raiz"><!--app-html--></div>
    <script type="module" src="/src/entries/client.jsx"></script>
  </body>
</html>
